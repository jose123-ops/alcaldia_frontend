<ion-app>

  <!-- MENU -->

  <ion-menu contentId="main-content">

    <ion-header>

      <ion-toolbar color="primary">

        <ion-title>

          Sistema Alcaldía

        </ion-title>

      </ion-toolbar>

    </ion-header>

    <ion-content>

      <div class="user-info">

        <ion-icon name="person-circle-outline">
        </ion-icon>

        <h2>
          Administrador
        </h2>

      </div>

      <ion-list>

        <ion-menu-toggle auto-hide="false">

          <ion-item routerLink="/dashboard">

            <ion-icon slot="start" name="home-outline">
            </ion-icon>

            <ion-label>
              Dashboard
            </ion-label>

          </ion-item>

          <ion-item routerLink="/activos-fijo" routerDirection="root">

            <ion-icon slot="start" name="desktop-outline">
            </ion-icon>

            <ion-label>
              Activos Fijos
            </ion-label>

          </ion-item>

          <ion-item>

            <ion-icon slot="start" name="cube-outline">
            </ion-icon>

            <ion-label>
              Bodega
            </ion-label>

          </ion-item>

          <ion-item>

            <ion-icon slot="start" name="people-outline">
            </ion-icon>

            <ion-label>
              Usuarios
            </ion-label>

          </ion-item>

          <ion-item>

            <ion-icon slot="start" name="document-text-outline">
            </ion-icon>

            <ion-label>
              Reportes
            </ion-label>

          </ion-item>

          <ion-item button (click)="logout()">

            <ion-icon slot="start" name="log-out-outline">
            </ion-icon>

            <ion-label>
              Cerrar Sesión
            </ion-label>

          </ion-item>

        </ion-menu-toggle>

      </ion-list>

    </ion-content>

  </ion-menu>

  <!-- CONTENIDO -->

  <div class="ion-page" id="main-content">

    <ion-router-outlet>
    </ion-router-outlet>

  </div>

</ion-app>
