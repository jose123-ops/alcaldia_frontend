<ion-content>

  <div class="login-container">

    <div class="logo-container">

      <ion-icon
        name="person"
        class="logo-icon">
      </ion-icon>

    </div>

    <div class="form-container">

      <ion-item lines="none">

        <ion-icon
          name="person-outline"
          slot="start">
        </ion-icon>

        <ion-input
          placeholder="Username"
          [(ngModel)]="usuario">
        </ion-input>

      </ion-item>

      <ion-item
        lines="none"
        class="ion-margin-top">

        <ion-icon
          name="lock-closed-outline"
          slot="start">
        </ion-icon>

        <ion-input

          [type]="showPassword ? 'text' : 'password'"

          placeholder="Password"

          [(ngModel)]="password">

        </ion-input>

        <ion-icon

          slot="end"

          class="eye-icon"

          [name]="showPassword
          ? 'eye-off-outline'
          : 'eye-outline'"

          (click)="togglePassword()">

        </ion-icon>

      </ion-item>

      <div class="options-row">

        <ion-checkbox></ion-checkbox>

        <span>
          Remember me
        </span>

      </div>

      <ion-button

        expand="block"

        class="login-button"

        (click)="login()">

        LOGIN

      </ion-button>

    </div>

  </div>

</ion-content>
